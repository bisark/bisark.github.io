    <title>Quiz Intermedio</title>
    <style>
    :root {
  color-scheme: light;
  --bg: #f3f7f5;
  --ink: #16211c;
  --muted: #607169;
  --panel: #ffffff;
  --line: #d8e2dd;
  --accent: #006d77;
  --accent-dark: #064f56;
  --good: #198754;
  --bad: #c43d31;
  --gold: #f3b61f;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* {
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  margin: 0;
  color: var(--ink);
  background:
    radial-gradient(circle at 18% 18%, rgba(243, 182, 31, 0.22), transparent 26rem),
    radial-gradient(circle at 82% 12%, rgba(0, 109, 119, 0.18), transparent 24rem),
    linear-gradient(135deg, #f8fbfa 0%, var(--bg) 48%, #e7efec 100%);
}

body::before {
  position: fixed;
  inset: 0;
  z-index: -1;
  content: "";
  background-image:
    linear-gradient(rgba(22, 33, 28, 0.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(22, 33, 28, 0.045) 1px, transparent 1px);
  background-size: 42px 42px;
  mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.8), transparent);
  animation: drift 18s linear infinite;
}

.app-shell {
  width: min(980px, calc(100% - 32px));
  margin: 0 auto;
  padding: 24px 0 40px;
}

.scorebar {
  position: sticky;
  top: 12px;
  z-index: 2;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  padding: 10px;
  border: 1px solid rgba(216, 226, 221, 0.8);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.82);
  backdrop-filter: blur(14px);
  box-shadow: 0 12px 30px rgba(22, 33, 28, 0.08);
}

.scorebar div {
  min-width: 0;
  padding: 10px 12px;
  border-radius: 6px;
  background: #f7faf9;
}

.label {
  display: block;
  color: var(--muted);
  font-size: 0.78rem;
  font-weight: 700;
  text-transform: uppercase;
}

.scorebar strong {
  display: block;
  margin-top: 3px;
  font-size: clamp(1.1rem, 3vw, 1.45rem);
}

.quiz-stage {
  position: relative;
  margin-top: 42px;
}

.progress-track {
  height: 8px;
  overflow: hidden;
  border-radius: 999px;
  background: #dce7e2;
}

.progress-bar {
  width: 0%;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--accent), var(--gold));
  transition: width 420ms ease;
}

.question-card,
.result-panel {
  position: relative;
  overflow: hidden;
  margin-top: 18px;
  padding: clamp(20px, 4vw, 36px);
  border: 1px solid var(--line);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.92);
  box-shadow: 0 24px 70px rgba(22, 33, 28, 0.12);
}

.question-card::after {
  position: absolute;
  right: -70px;
  bottom: -90px;
  width: 190px;
  height: 190px;
  border: 18px solid rgba(0, 109, 119, 0.1);
  border-radius: 50%;
  content: "";
  animation: pulse 3.5s ease-in-out infinite;
}

.question-card.enter {
  animation: cardIn 360ms ease both;
}

.question-meta {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  color: var(--muted);
  font-size: 0.9rem;
  font-weight: 800;
  text-transform: uppercase;
}

h1 {
  position: relative;
  margin: 18px 0 24px;
  font-size: clamp(1.45rem, 3.5vw, 2.35rem);
  line-height: 1.18;
  letter-spacing: 0;
}

.answers {
  position: relative;
  z-index: 1;
  display: grid;
  gap: 12px;
}

.answer-button {
  width: 100%;
  min-height: 58px;
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--ink);
  background: #fbfdfc;
  font: inherit;
  font-weight: 750;
  line-height: 1.28;
  text-align: left;
  cursor: pointer;
  transition: transform 180ms ease, border-color 180ms ease, background 180ms ease, box-shadow 180ms ease;
}

.answer-button:hover:not(:disabled),
.answer-button:focus-visible {
  border-color: rgba(0, 109, 119, 0.45);
  outline: none;
  transform: translateY(-2px);
  box-shadow: 0 10px 22px rgba(0, 109, 119, 0.12);
}

.answer-button.correct {
  border-color: rgba(25, 135, 84, 0.5);
  background: #e7f6ee;
  animation: pop 280ms ease;
}

.answer-button.wrong {
  border-color: rgba(196, 61, 49, 0.55);
  background: #fdecea;
  animation: shake 260ms ease;
}

.answer-button:disabled {
  cursor: default;
}

.actions {
  display: flex;
  justify-content: flex-end;
  margin-top: 22px;
}

.next-button {
  min-width: 132px;
  min-height: 46px;
  border: 0;
  border-radius: 8px;
  color: #fff;
  background: var(--accent);
  font: inherit;
  font-weight: 850;
  cursor: pointer;
  transition: transform 180ms ease, background 180ms ease, opacity 180ms ease;
}

.next-button:hover:not(:disabled),
.next-button:focus-visible {
  background: var(--accent-dark);
  outline: none;
  transform: translateY(-1px);
}

.next-button:disabled {
  opacity: 0.45;
  cursor: default;
}

.result-panel {
  display: grid;
  justify-items: center;
  gap: 12px;
  text-align: center;
}

.result-panel strong {
  color: var(--accent-dark);
  font-size: clamp(3rem, 12vw, 6rem);
  line-height: 1;
}

.result-kicker {
  color: var(--muted);
  font-weight: 850;
  text-transform: uppercase;
}

.result-panel p {
  max-width: 46rem;
  margin: 0 0 8px;
  color: var(--muted);
  font-size: 1.05rem;
}

.hidden {
  display: none;
}

@keyframes drift {
  from {
    background-position: 0 0, 0 0;
  }
  to {
    background-position: 42px 42px, 42px 42px;
  }
}

@keyframes cardIn {
  from {
    opacity: 0;
    transform: translateY(16px) scale(0.985);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes pulse {
  50% {
    transform: scale(1.08);
  }
}

@keyframes pop {
  50% {
    transform: scale(1.015);
  }
}

@keyframes shake {
  25% {
    transform: translateX(-5px);
  }
  50% {
    transform: translateX(4px);
  }
  75% {
    transform: translateX(-2px);
  }
}

@media (max-width: 640px) {
  .app-shell {
    width: min(100% - 20px, 980px);
    padding-top: 10px;
  }

  .scorebar {
    top: 6px;
    grid-template-columns: 1fr;
  }

  .quiz-stage {
    margin-top: 24px;
  }
}
</style>
  </head>
  <body>
    <main class="app-shell">
      <header class="scorebar" aria-label="Punteggio">
        <div>
          <span class="label">Totali</span>
          <strong id="totalScore">0 / 15</strong>
        </div>
        <div>
          <span class="label">Corrette</span>
          <strong id="correctScore">0</strong>
        </div>
        <div>

          <strong id="wrongScore">0</strong>
        </div>
      </header>

      <section class="quiz-stage" aria-live="polite">
        <div class="progress-track" aria-hidden="true">
          <div id="progressBar" class="progress-bar"></div>
        </div>

        <div id="questionCard" class="question-card">
          <div class="question-meta">
            <span id="questionCounter">Domanda 1 di 15</span>
            <span id="sourceId">#</span>
          </div>
          <h1 id="questionText">Caricamento...</h1>
          <div id="answers" class="answers"></div>
          <div class="actions">
            <button id="nextButton" class="next-button" type="button" disabled>Avanti</button>
          </div>
        </div>

        <div id="resultPanel" class="result-panel hidden">
          <span class="result-kicker">Risultato finale</span>
          <strong id="finalGrade">0 / 30</strong>
          <p id="finalText"></p>
          <button id="restartButton" class="next-button" type="button">Nuovo quiz</button>
        </div>
      </section>
    </main>

    <script>
    const QUIZ_SIZE = 31;

const state = {
  allQuestions: [],
  questions: [],
  currentIndex: 0,
  correct: 0,
  wrong: 0,
  answered: false,
  advanceTimer: null,
};

const totalScore = document.querySelector("#totalScore");
const correctScore = document.querySelector("#correctScore");
const wrongScore = document.querySelector("#wrongScore");
const progressBar = document.querySelector("#progressBar");
const questionCard = document.querySelector("#questionCard");
const questionCounter = document.querySelector("#questionCounter");
const sourceId = document.querySelector("#sourceId");
const questionText = document.querySelector("#questionText");
const answers = document.querySelector("#answers");
const nextButton = document.querySelector("#nextButton");
const resultPanel = document.querySelector("#resultPanel");
const finalGrade = document.querySelector("#finalGrade");
const finalText = document.querySelector("#finalText");
const restartButton = document.querySelector("#restartButton");

function shuffle(items) {
  return [...items]
    .map((item) => ({ item, sort: Math.random() }))
    .sort((a, b) => a.sort - b.sort)
    .map(({ item }) => item);
}

function startQuiz() {
  state.questions = shuffle(state.allQuestions).slice(0, QUIZ_SIZE);
  state.currentIndex = 0;
  state.correct = 0;
  state.wrong = 0;
  state.answered = false;
  resultPanel.classList.add("hidden");
  questionCard.classList.remove("hidden");
  renderQuestion();
}

function updateScore() {
  const answered = state.correct + state.wrong;
  totalScore.textContent = `${answered} / ${QUIZ_SIZE}`;
  correctScore.textContent = state.correct;
  wrongScore.textContent = state.wrong;
  progressBar.style.width = `${(answered / QUIZ_SIZE) * 100}%`;
}

function renderQuestion() {
  const question = state.questions[state.currentIndex];
  state.answered = false;
  clearTimeout(state.advanceTimer);
  nextButton.disabled = true;
  nextButton.textContent = state.currentIndex === QUIZ_SIZE - 1 ? "Risultato" : "Avanti";

  questionCard.classList.remove("enter");
  void questionCard.offsetWidth;
  questionCard.classList.add("enter");

  questionCounter.textContent = `Domanda ${state.currentIndex + 1} di ${QUIZ_SIZE}`;
  sourceId.textContent = `#${question.id}`;
  questionText.textContent = question.question;
  answers.innerHTML = "";

  question.options.forEach((option, index) => {
    const button = document.createElement("button");
    button.className = "answer-button";
    button.type = "button";
    button.textContent = option;
    button.addEventListener("click", () => selectAnswer(index));
    answers.append(button);
  });

  updateScore();
}

function selectAnswer(selectedIndex) {
  if (state.answered) {
    return;
  }

  state.answered = true;
  const question = state.questions[state.currentIndex];
  const buttons = [...answers.querySelectorAll(".answer-button")];

  buttons.forEach((button) => {
    button.disabled = true;
  });

  buttons[question.correctIndex].classList.add("correct");

  if (selectedIndex === question.correctIndex) {
    state.correct += 1;
  } else {
    state.wrong += 1;
    buttons[selectedIndex].classList.add("wrong");
  }

  nextButton.disabled = false;
  updateScore();
  state.advanceTimer = setTimeout(goNext, 900);
}

function showResults() {
  const grade = Math.round((state.correct / QUIZ_SIZE) * 30);
  questionCard.classList.add("hidden");
  resultPanel.classList.remove("hidden");
  finalGrade.textContent = `${grade} / 30`;
  finalText.textContent = `Hai risposto correttamente a ${state.correct} domande su ${QUIZ_SIZE}. Errori: ${state.wrong}.`;
  progressBar.style.width = "100%";
}

function goNext() {
  clearTimeout(state.advanceTimer);
  if (state.currentIndex < QUIZ_SIZE - 1) {
    state.currentIndex += 1;
    renderQuestion();
  } else {
    showResults();
  }
}

nextButton.addEventListener("click", goNext);

restartButton.addEventListener("click", startQuiz);

function bootQuiz(questions) {
  state.allQuestions = questions;
  startQuiz();
}

function loadEmbeddedQuestions() {
  const embedded = document.querySelector("#questions-data");
  if (!embedded || !embedded.textContent.trim()) {
    return null;
  }

  const questions = JSON.parse(embedded.textContent);
  return Array.isArray(questions) && questions.length > 0 ? questions : null;
}

const embeddedQuestions = loadEmbeddedQuestions();

if (embeddedQuestions) {
  bootQuiz(embeddedQuestions);
} else {
  fetch("questions.json")
  .then((response) => {
    if (!response.ok) {
      throw new Error("Impossibile caricare questions.json");
    }
    return response.json();
  })
  .then((questions) => {
    bootQuiz(questions);
  })
  .catch((error) => {
    questionText.textContent = error.message;
  });
}
</script>
